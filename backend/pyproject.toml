[project]
name = "lifegrid"
version = "0.1.0"
requires-python = ">=3.12"
# Exact pins (spec section 9). Update deliberately, then re-run `make test`.
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.3",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "PyOTP==2.10.0",
  "cryptography==50.0.2",
  "celery==5.6.3",
  "redis==8.1.0",
  "pandas==3.0.6",
  "numpy==2.5.3",
  "statsmodels==0.15.0",
  "scikit-learn==1.9.1",
  "ortools==9.15.6755",
  "PyYAML==6.0.3",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "hypothesis==6.168.3", "ruff==0.16.10", "mypy==2.4.0"]
docs = ["playwright", "pypdf", "pillow"]  # user manual: docs/manual/README.md

[tool.setuptools.packages.find]
include = ["app*", "simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx`"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.modules.*"
strict = true

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false  # celery task decorator is untyped
